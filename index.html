<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8f6f2;
      --gold-primary: #c59b27;
      --gold-dark: #8c6a12;
      --text-dark: #3a3227;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Cracker Canvas Layer */
    #cracker-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    /* Floating Balloons Layer */
    #balloon-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .floating-balloon {
      position: absolute;
      bottom: -120px;
      width: 50px;
      height: 62px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: floatUp 9s ease-in-out infinite;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12));
    }

    .floating-balloon::before {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: inherit;
      border-radius: 30%;
    }

    .floating-balloon::after {
      content: "";
      position: absolute;
      bottom: -22px;
      left: 50%;
      width: 2px;
      height: 20px;
      background: rgba(140, 140, 140, 0.45);
      transform: translateX(-50%);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.9);
        opacity: 0.95;
      }
      25% {
        transform: translateY(-35vh) rotate(12deg) scale(1);
      }
      50% {
        transform: translateY(-70vh) rotate(-10deg) scale(1.02);
      }
      75% {
        transform: translateY(-95vh) rotate(8deg) scale(0.98);
      }
      100% {
        transform: translateY(-125vh) rotate(-5deg) scale(0.95);
        opacity: 0;
      }
    }

    /* Main Card */
    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px 20px 40px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
      z-index: 10;
      overflow: hidden;
      animation: gentleFloat 4s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .balloon-header {
      width: 100%;
      height: 140px;
      background-image: radial-gradient(circle at 50% 30%, #ffd700 10%, transparent 20%),
                        radial-gradient(circle at 20% 20%, #e0e0e0 15%, transparent 25%),
                        radial-gradient(circle at 80% 25%, #c59b27 12%, transparent 22%);
      background-size: 60px 60px;
      position: relative;
      margin-top: -10px;
    }

    .balloon-header::before {
      content: "🎈 🎉 🎈 🥳 🎈";
      font-size: 2rem;
      letter-spacing: 12px;
      display: block;
      padding-top: 15px;
      opacity: 0.9;
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.6rem;
      line-height: 1.1;
      background: linear-gradient(120deg, #aa771c 0%, #ffd700 30%, #fff4b8 50%, #ffd700 70%, #aa771c 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 10px;
      filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.12));
      animation: goldShimmer 3s linear infinite;
    }

    @keyframes goldShimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Permanently Fixed Name */
    .name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4a3e2e;
      margin: 15px 0 25px;
      user-select: none;
    }

    /* Permanently Fixed Frame */
    .photo-container {
      width: 210px;
      height: 210px;
      margin: 0 auto 25px;
      border-radius: 50%;
      border: 6px solid var(--gold-primary);
      box-shadow: 0 0 20px rgba(197, 155, 39, 0.4);
      position: relative;
      overflow: hidden;
      background-color: #f0ece1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* Prevents any user interaction */
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .wishes {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #5a5043;
      padding: 0 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="balloon-container"></div>
  <canvas id="cracker-canvas"></canvas>

  <div class="card">
    <div class="balloon-header"></div>

    <h1 class="title">Happy<br>Birthday</h1>
    
    <!-- CHANGE THE NAME IN CODE HERE BEFORE DEPLOYING -->
    <div class="name">NAVNIT KUMAR</div>

    <!-- CHANGE IMAGE FILE PATH IN CODE HERE BEFORE DEPLOYING -->
    <div class="photo-container">
      <img src="NAVNIT.jpeg" alt="Birthday Boy Photo">
    </div>

    <p class="wishes">
      Sending you smiles for every moment of your special day... Have a wonderful time and a very happy birthday!
    </p>
  </div>

  <script>
    // 3D Balloon Generator
    const balloonStyles = [
      'radial-gradient(circle at 35% 30%, #ffe89e 0%, #d4af37 60%, #8c6a12 100%)',
      'radial-gradient(circle at 35% 30%, #ffffff 0%, #e0e0e0 60%, #a6a6a6 100%)',
      'radial-gradient(circle at 35% 30%, #fff1b3 0%, #f4c430 60%, #a67c1e 100%)',
      'radial-gradient(circle at 35% 30%, #ffb3b3 0%, #ff4d4d 60%, #990000 100%)',
      'radial-gradient(circle at 35% 30%, #ffd9b3 0%, #e67e22 60%, #904d0e 100%)'
    ];

    const balloonContainer = document.getElementById('balloon-container');

    function createBalloon() {
      const balloon = document.createElement('div');
      balloon.className = 'floating-balloon';
      balloon.style.background = balloonStyles[Math.floor(Math.random() * balloonStyles.length)];
      balloon.style.left = Math.random() * 92 + 'vw';
      
      const duration = 7 + Math.random() * 6;
      balloon.style.animationDuration = duration + 's';
      
      balloonContainer.appendChild(balloon);
      setTimeout(() => balloon.remove(), duration * 1000);
    }
    setInterval(createBalloon, 750);

    // Popping Crackers Engine
    const canvas = document.getElementById('cracker-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let particles = [];
    const crackerColors = ['#ffd700', '#ffffff', '#ff3366', '#00e5ff', '#ff9900', '#76ff03'];

    function spawnCrackerBurst(x, y) {
      for (let i = 0; i < 70; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 11 + 3;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 4 + 2,
          color: crackerColors[Math.floor(Math.random() * crackerColors.length)],
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015,
          sparkle: Math.random() > 0.5
        });
      }
    }

    function renderCrackers() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.vx *= 0.98;
        p.alpha -= p.decay;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        
        ctx.beginPath();
        if (p.sparkle && Math.random() > 0.3) {
          ctx.arc(p.x, p.y, p.size * 1.5, 0, Math.PI * 2);
        } else {
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(renderCrackers);
    }

    function autoPopCrackers() {
      const leftX = window.innerWidth * (0.15 + Math.random() * 0.2);
      const rightX = window.innerWidth * (0.65 + Math.random() * 0.2);
      const targetY = window.innerHeight * (0.2 + Math.random() * 0.4);

      spawnCrackerBurst(leftX, targetY);
      spawnCrackerBurst(rightX, targetY);
    }

    setInterval(autoPopCrackers, 3000);
    renderCrackers();
    autoPopCrackers();
  </script>

</body>
</html>
